apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/** Reads KEY=value configuration from the ignored frontend .env file. */
def readEnvValue(String name) {
    def envFile = file("$rootDir/../.env")
    if (!envFile.exists()) return ""
    def line = envFile.readLines().find { it.trim().startsWith("${name}=") }
    return line == null ? "" : line.substring(line.indexOf('=') + 1).trim()
}

def hasReleaseSigning = [
    'MYAPP_UPLOAD_STORE_FILE',
    'MYAPP_UPLOAD_STORE_PASSWORD',
    'MYAPP_UPLOAD_KEY_ALIAS',
    'MYAPP_UPLOAD_KEY_PASSWORD',
].every { project.hasProperty(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.omw.omw_front"
    defaultConfig {
        applicationId "com.omw.omw_front"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 17
        versionName "2.1.2"
        manifestPlaceholders = [
            GOOGLE_MAPS_ANDROID_API_KEY: readEnvValue("GOOGLE_MAPS_ANDROID_API_KEY"),
            NAVER_MAP_CLIENT_ID: readEnvValue("NAVER_MAP_CLIENT_ID"),
            usesCleartextTraffic: "false",
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders.usesCleartextTraffic = "true"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            manifestPlaceholders.usesCleartextTraffic = "false"
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
